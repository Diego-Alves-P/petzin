services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: petzin
      POSTGRES_PASSWORD: petzin
      POSTGRES_DB: petzin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petzin -d petzin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=petzin;Username=petzin;Password=petzin
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
