<form class="grid gap-3 rounded border border-slate-200 bg-white p-4" [formGroup]="form" (ngSubmit)="enviar()">
  <h2 class="text-lg font-medium">{{ editando() ? 'Editar tutor' : 'Novo tutor' }}</h2>
  <label class="grid gap-1 text-sm">
    Nome
    <input class="rounded border border-slate-300 px-3 py-2" formControlName="nome" />
    @if (form.controls.nome.touched && form.controls.nome.invalid) {
      <span class="text-red-700">Informe o nome.</span>
    }
  </label>
  <label class="grid gap-1 text-sm">
    Telefone
    <input class="rounded border border-slate-300 px-3 py-2" formControlName="telefone" />
    @if (form.controls.telefone.touched && form.controls.telefone.invalid) {
      <span class="text-red-700">Informe o telefone.</span>
    }
  </label>
  <label class="grid gap-1 text-sm">
    E-mail
    <input class="rounded border border-slate-300 px-3 py-2" formControlName="email" />
    @if (form.controls.email.errors?.['email']) {
      <span class="text-red-700">Informe um e-mail válido.</span>
    }
  </label>
  <app-mensagem-erro [texto]="erro()" />
  <div class="flex gap-2">
    <button class="rounded bg-slate-800 px-4 py-2 text-sm text-white" type="submit">Salvar</button>
    <button class="rounded border border-slate-300 px-4 py-2 text-sm" type="button" (click)="limpar()">Limpar</button>
  </div>
</form>
