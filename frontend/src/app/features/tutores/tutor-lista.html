<div class="rounded border border-slate-200 bg-white p-4">
  <h2 class="mb-3 text-lg font-medium">Tutores</h2>
  @if (carregando()) {
    <p class="text-sm text-slate-500">Carregando.</p>
  } @else if (tutores().length === 0) {
    <p class="text-sm text-slate-500">Nenhum tutor cadastrado.</p>
  } @else {
    <table class="w-full text-left text-sm">
      <thead class="text-slate-500">
        <tr>
          <th class="py-2 font-medium">Nome</th>
          <th class="py-2 font-medium">Telefone</th>
          <th class="py-2 font-medium">E-mail</th>
          <th class="py-2 font-medium">Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (tutor of tutores(); track tutor.id) {
          <tr class="border-t border-slate-100">
            <td class="py-2">{{ tutor.nome }}</td>
            <td class="py-2">{{ tutor.telefone }}</td>
            <td class="py-2">{{ tutor.email || 'Não informado' }}</td>
            <td class="py-2">
              <button class="mr-3 text-slate-700" type="button" (click)="editar.emit(tutor)">Editar</button>
              <button class="text-red-700" type="button" (click)="excluir.emit(tutor)">Excluir</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
