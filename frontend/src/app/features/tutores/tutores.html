  <app-tutor-form [erro]="erroFormulario()" (salvarFormulario)="salvar($event)" />
  <app-mensagem-erro [texto]="erroLista()" />
  <app-tutor-lista
    [tutores]="tutores()"

    (excluir)="excluir($event)"
  />
</section>
