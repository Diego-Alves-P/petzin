<section class="grid gap-6">
  <app-reserva-form
    [pets]="pets()"
    [canis]="canis()"
    [erro]="erroFormulario()"
    (salvarFormulario)="salvar($event)"
  />
  <app-mensagem-erro [texto]="erroLista()" />
  <app-reserva-lista
    [reservas]="reservas()"
    [carregando]="carregando()"
    (editar)="editar($event)"
    (excluir)="excluir($event)"
  />
</section>
