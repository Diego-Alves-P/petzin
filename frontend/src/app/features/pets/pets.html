<section class="grid gap-6">
  <app-pet-form [tutores]="tutores()" [erro]="erroFormulario()" (salvarFormulario)="salvar($event)" />
  <app-mensagem-erro [texto]="erroLista()" />
  <app-pet-lista
    [pets]="pets()"
    [carregando]="carregando()"
    (editar)="editar($event)"
    (historico)="abrirHistorico($event)"
    (excluir)="excluir($event)"
  />
  @if (petHistorico(); as pet) {
    <app-historico-pet
      [nomePet]="pet.nome"
      [itens]="historico()"
      [carregando]="carregandoHistorico()"
      [erro]="erroHistorico()"
      (salvarHistorico)="adicionarHistorico($event)"
    />
  }
</section>
