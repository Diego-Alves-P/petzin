<div class="rounded border border-slate-200 bg-white p-4">
  <h2 class="mb-3 text-lg font-medium">Canis</h2>
  @if (carregando()) {
    <p class="text-sm text-slate-500">Carregando.</p>
  } @else if (canis().length === 0) {
    <p class="text-sm text-slate-500">Nenhum canil cadastrado.</p>
  } @else {
    <table class="w-full text-left text-sm">
      <thead class="text-slate-500">
        <tr>
          <th class="py-2 font-medium">Número</th>
          <th class="py-2 font-medium">Porte</th>
          <th class="py-2 font-medium">Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (canil of canis(); track canil.id) {
          <tr class="border-t border-slate-100">
            <td class="py-2">{{ canil.numero }}</td>
            <td class="py-2">{{ canil.porte }}</td>
            <td class="py-2">
              <button class="mr-3 text-slate-700" type="button" (click)="editar.emit(canil)">Editar</button>
              <button class="text-red-700" type="button" (click)="excluir.emit(canil)">Excluir</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
