<section class="grid gap-6">
  <app-canil-form [erro]="erroFormulario()" (salvarFormulario)="salvar($event)" />
  <app-mensagem-erro [texto]="erroLista()" />
  <app-canil-lista
    [canis]="canis()"
    [carregando]="carregando()"
    (editar)="editar($event)"
    (excluir)="excluir($event)"
  />
</section>
